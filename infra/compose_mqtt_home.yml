services:
  watcher:
    image: parasolnikov/watcher:0.8
    restart: unless-stopped
    environment:
      TZ: Europe/Warsaw
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,time; sys.exit(0 if time.time() - int(open('/tmp/last_seen').read()) < 600 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  controller:
    image: parasolnikov/controller:0.8
    restart: unless-stopped
    environment:
      TZ: Europe/Warsaw

  frontend:
    image: parasolnikov/frontend:0.8
    restart: unless-stopped
    environment:
      TZ: Europe/Warsaw
    ports:
      - "5002:5002"
